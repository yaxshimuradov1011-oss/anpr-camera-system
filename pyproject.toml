[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anpr-camera-system"
version = "0.1.0"
description = "Production-oriented Automatic Number Plate Recognition (ANPR) service"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ANPR Team"}]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0.84",
  "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["app", "app.detectors", "app.ocr"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

target-version = "py310"

